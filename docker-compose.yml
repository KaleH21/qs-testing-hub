# Cả stack, kiểu Cá nhân mặc định (D-32): docker compose up -d → http://127.0.0.1:8080
# Phase 0 chỉ có web, api, worker-core + hạ tầng. worker-browser/k6/security, egress-proxy,
# zap, backup được thêm ở phase tương ứng (docs/13 §2).
name: qahub

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-personal}
  HUB_BIND_ADDRESS: ${HUB_BIND_ADDRESS:-127.0.0.1}
  DATABASE_URL: postgres://qahub:${POSTGRES_PASSWORD}@postgres:5432/qahub
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT: http://minio:9000

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  user: '10001'
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

services:
  web:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: web }
    image: qa-hub/web:dev
    ports: ['${HUB_BIND_ADDRESS:-127.0.0.1}:8080:8080']
    depends_on: [api]
    networks: [edge, app]
    restart: unless-stopped

  api:
    <<: *hardening
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: api }
    image: qa-hub/api:dev
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    networks: [app]

  worker-core:
    <<: *hardening
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: worker }
    image: qa-hub/worker:dev
    command: ['node', 'apps/worker/dist/main-core.js']
    environment: *app-env
    stop_grace_period: 60s
    depends_on: [redis]
    networks: [app]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: qahub
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qahub']
      interval: 5s
      retries: 10
    networks: [app]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--requirepass',
        '${REDIS_PASSWORD:?thiếu REDIS_PASSWORD}',
      ]
    volumes: [redisdata:/data]
    networks: [app]
    restart: unless-stopped

  minio:
    # shortcut: tag cần kiểm lại trước khi dùng (MinIO community đã đổi cách phát hành từ 2025)
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?thiếu S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?thiếu S3_SECRET_KEY}
    volumes: [miniodata:/data]
    networks: [app]
    restart: unless-stopped

networks:
  edge: {}
  app: { internal: true }

volumes:
  pgdata:
  redisdata:
  miniodata:
